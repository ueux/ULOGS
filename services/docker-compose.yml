services:
  redis:
    image: redis:7-alpine
    container_name: ulogs-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ulogs}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-ulogs} --appendonly yes --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-ulogs}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.7-alpine
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ulimits:
      nofile: 262144

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    depends_on:
      - clickhouse
    environment:
      VITE_CLICKHOUSE_URL: http://host.docker.internal:8123
      VITE_CLICKHOUSE_USER: default
      VITE_CLICKHOUSE_PASS: ''
    ports:
      - '5521:5521/tcp'
  nats:
    image: nats:2.10-alpine
    container_name: ulogs-logs-nats
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats_data:/data
    command: ['nats-server', '-js', '-m', '8222']
volumes:
  redis_data:
  clickhouse_data:
  nats_data:
