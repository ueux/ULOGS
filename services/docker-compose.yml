services:
  redis:
    image: redis:7-alpine
    container_name: ulogs-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ulogs}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ulogs --appendonly yes --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-ulogs}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  redis_data: